name: open-telemetry25

on:
  push:
    branches:
    - main
    paths:
    - 'open-telemetry/agent/Dockerfile.jdk25'
    - 'open-telemetry/agent/Dockerfile.jdk25-alpine'
    - 'open-telemetry/agent/Dockerfile.jdk25-ffmpeg'
    - 'open-telemetry/agent/test-jdk25-image.sh'
    - '.github/workflows/open-telemetry25.yml'
  pull_request:
    paths:
    - 'open-telemetry/agent/Dockerfile.jdk25'
    - 'open-telemetry/agent/Dockerfile.jdk25-alpine'
    - 'open-telemetry/agent/Dockerfile.jdk25-ffmpeg'
    - 'open-telemetry/agent/test-jdk25-image.sh'
    - '.github/workflows/open-telemetry25.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish candidate images to GHCR
        required: true
        type: boolean
        default: false

env:
  OTEL_VERSION: 2.31.0
  OTEL_SHA256: d48673b2ff956b26d809bc34243649913d4eefd9191c4e175b686da633e0134b

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25
          tag: 2.31.0-jdk25
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-alpine
          tag: 2.31.0-jdk25-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-ffmpeg
          tag: 2.31.0-jdk25-ffmpeg
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build local smoke-test image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        pull: true
        tags: local/open-telemetry:${{ matrix.tag }}
        build-args: |
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
    - name: Test JDK and OpenTelemetry Agent runtime
      run: >-
        ./open-telemetry/agent/test-jdk25-image.sh
        local/open-telemetry:${{ matrix.tag }}
        25
        ${{ env.OTEL_VERSION }}
    - name: Build multi-architecture candidate
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        pull: true
        build-args: |
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25
          tag: 2.31.0-jdk25
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-alpine
          tag: 2.31.0-jdk25-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-ffmpeg
          tag: 2.31.0-jdk25-ffmpeg
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Publish candidate image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: ghcr.io/keecon/open-telemetry:${{ matrix.tag }}
        build-args: |
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
