name: open-telemetry-v2-jdk21

on:
  push:
    branches: [main]
    paths:
    - open-telemetry/agent/Dockerfile
    - open-telemetry/agent/Dockerfile.distroless
    - open-telemetry/agent/Dockerfile.alpine
    - open-telemetry/agent/Dockerfile.ffmpeg
    - open-telemetry/agent/otel-v2.env
    - open-telemetry/agent/test-java-image.sh
    - open-telemetry/agent/build-java-images.sh
    - open-telemetry/agent/tests/test_build_java_images.py
    - open-telemetry/agent/TestDistrolessFFmpeg.java
    - .github/workflows/open-telemetry2-jdk21.yml
  pull_request:
    paths:
    - open-telemetry/agent/Dockerfile
    - open-telemetry/agent/Dockerfile.distroless
    - open-telemetry/agent/Dockerfile.alpine
    - open-telemetry/agent/Dockerfile.ffmpeg
    - open-telemetry/agent/otel-v2.env
    - open-telemetry/agent/test-java-image.sh
    - open-telemetry/agent/build-java-images.sh
    - open-telemetry/agent/tests/test_build_java_images.py
    - open-telemetry/agent/TestDistrolessFFmpeg.java
    - .github/workflows/open-telemetry2-jdk21.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-telemetry-v2-jdk21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [distroless, jdk, jre, jre-alpine, ffmpeg]
    steps:
    - uses: actions/checkout@v7
    - name: Test image build and publication flow
      run: python3 -m unittest discover -s open-telemetry/agent/tests -v
    - name: Load OpenTelemetry version
      run: cat open-telemetry/agent/otel-v2.env >> "$GITHUB_ENV"
    - uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {"features": {"containerd-snapshotter": true}}
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish))
      with:
        registry: ghcr.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build, test, and optionally publish the same image
      env:
        PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
      run: ./open-telemetry/agent/build-java-images.sh 21 21.0.13.1_2 "$PUBLISH" "${{ matrix.variant }}"
