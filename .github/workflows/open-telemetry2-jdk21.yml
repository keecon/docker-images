name: open-telemetry-v2-jdk21

on:
  push:
    branches: [main]
    paths:
    - open-telemetry/agent/Dockerfile.jdk21
    - open-telemetry/agent/Dockerfile.distroless
    - open-telemetry/agent/Dockerfile.jdk21-alpine
    - open-telemetry/agent/Dockerfile.jdk21-ffmpeg
    - open-telemetry/agent/otel-v2.env
    - open-telemetry/agent/test-java-image.sh
    - .github/workflows/open-telemetry2-jdk21.yml
  pull_request:
    paths:
    - open-telemetry/agent/Dockerfile.jdk21
    - open-telemetry/agent/Dockerfile.distroless
    - open-telemetry/agent/Dockerfile.jdk21-alpine
    - open-telemetry/agent/Dockerfile.jdk21-ffmpeg
    - open-telemetry/agent/otel-v2.env
    - open-telemetry/agent/test-java-image.sh
    - .github/workflows/open-telemetry2-jdk21.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-telemetry-v2-jdk21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.distroless
          java_base_tag: gcr.io/distroless/java21-debian13:latest
          tag_suffix: jre21-distroless
          java_major: 21
          java_kind: jre
          variant: distroless
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.13_9-jdk-noble
          tag_suffix: jdk21
          java_major: 21
          java_kind: jdk
          variant: plain
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.13_9-jdk-alpine
          tag_suffix: jdk21-alpine
          java_major: 21
          java_kind: jdk
          variant: alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.13_9-jdk-noble
          tag_suffix: jdk21-ffmpeg
          java_major: 21
          java_kind: jdk
          variant: ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.13_9-jre-noble
          tag_suffix: jre21
          java_major: 21
          java_kind: jre
          variant: plain
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.13_9-jre-alpine
          tag_suffix: jre21-alpine
          java_major: 21
          java_kind: jre
          variant: alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.13_9-jre-noble
          tag_suffix: jre21-ffmpeg
          java_major: 21
          java_kind: jre
          variant: ffmpeg
    steps:
    - uses: actions/checkout@v7
    - name: Load OpenTelemetry version
      run: cat open-telemetry/agent/otel-v2.env >> "$GITHUB_ENV"
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Build local smoke-test image
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        pull: true
        tags: local/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
    - name: Test Java and OpenTelemetry Agent runtime
      run: >-
        ./open-telemetry/agent/test-java-image.sh
        local/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
        ${{ env.OTEL_VERSION }}
        ${{ matrix.java_major }}
        ${{ matrix.java_kind }}
        ${{ matrix.variant }}
    - name: Build multi-architecture candidate
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        pull: true
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.distroless
          java_base_tag: gcr.io/distroless/java21-debian13:latest
          tag_suffix: jre21-distroless
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.13_9-jdk-noble
          tag_suffix: jdk21
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.13_9-jdk-alpine
          tag_suffix: jdk21-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.13_9-jdk-noble
          tag_suffix: jdk21-ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.13_9-jre-noble
          tag_suffix: jre21
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.13_9-jre-alpine
          tag_suffix: jre21-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.13_9-jre-noble
          tag_suffix: jre21-ffmpeg
    steps:
    - uses: actions/checkout@v7
    - name: Load OpenTelemetry version
      run: cat open-telemetry/agent/otel-v2.env >> "$GITHUB_ENV"
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and publish OpenTelemetry v2 image after verification
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: |
          ghcr.io/keecon/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
          ghcr.io/keecon/open-telemetry:2-${{ matrix.tag_suffix }}
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
