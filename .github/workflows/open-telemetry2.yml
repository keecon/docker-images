name: open-telemetry-v2

on:
  push:
    branches:
    - main
    paths:
    - 'open-telemetry/**'
    - '.github/workflows/open-telemetry2.yml'
  pull_request:
    paths:
    - 'open-telemetry/**'
    - '.github/workflows/open-telemetry2.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified OpenTelemetry v2 images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-telemetry-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  OTEL_VERSION: 2.31.1
  OTEL_SHA256: bbf83c151b6400709e2f225bdd07a04f839d9d13b8b93464241333fd25d3e3ba

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.jdk11
          java_base_tag: 11.0.32_9-jdk-alpine
          tag_suffix: jdk11
          platforms: linux/amd64
          java_major: 11
          java_kind: jdk
          variant: alpine
          max_size_bytes: 450000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17
          java_base_tag: 17.0.20_8-jdk-noble
          tag_suffix: jdk17
          java_major: 17
          java_kind: jdk
          variant: plain
          max_size_bytes: 550000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17-alpine
          java_base_tag: 17.0.20_8-jdk-alpine
          tag_suffix: jdk17-alpine
          platforms: linux/amd64
          java_major: 17
          java_kind: jdk
          variant: alpine
          max_size_bytes: 450000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17-ffmpeg
          java_base_tag: 17.0.20_8-jdk-noble
          tag_suffix: jdk17-ffmpeg
          java_major: 17
          java_kind: jdk
          variant: ffmpeg
          max_size_bytes: 1000000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.12_8-jdk-noble
          tag_suffix: jdk21
          java_major: 21
          java_kind: jdk
          variant: plain
          max_size_bytes: 600000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.12_8-jdk-alpine
          tag_suffix: jdk21-alpine
          java_major: 21
          java_kind: jdk
          variant: alpine
          max_size_bytes: 450000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.12_8-jdk-noble
          tag_suffix: jdk21-ffmpeg
          java_major: 21
          java_kind: jdk
          variant: ffmpeg
          max_size_bytes: 1000000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.12_8-jre-noble
          tag_suffix: jre21
          java_major: 21
          java_kind: jre
          variant: plain
          max_size_bytes: 350000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.12_8-jre-alpine
          tag_suffix: jre21-alpine
          java_major: 21
          java_kind: jre
          variant: alpine
          max_size_bytes: 300000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.12_8-jre-noble
          tag_suffix: jre21-ffmpeg
          java_major: 21
          java_kind: jre
          variant: ffmpeg
          max_size_bytes: 800000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25
          java_base_tag: 25.0.4_7-jdk-noble
          tag_suffix: jdk25
          java_major: 25
          java_kind: jdk
          variant: plain
          max_size_bytes: 600000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-alpine
          java_base_tag: 25.0.4_7-jdk-alpine
          tag_suffix: jdk25-alpine
          java_major: 25
          java_kind: jdk
          variant: alpine
          max_size_bytes: 450000000
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-ffmpeg
          java_base_tag: 25.0.4_7-jdk-noble
          tag_suffix: jdk25-ffmpeg
          java_major: 25
          java_kind: jdk
          variant: ffmpeg
          max_size_bytes: 1000000000
        - dockerfile: open-telemetry/agent/Dockerfile.tomcat10.jdk17
          java_base_tag: 10.1.59-jdk17-temurin-noble
          tag_suffix: tomcat10-jdk17
          java_major: 17
          java_kind: jdk
          variant: tomcat
          max_size_bytes: 700000000
        - dockerfile: open-telemetry/agent/Dockerfile.tomcat9.jdk11
          java_base_tag: 9.0.121-jdk11-temurin-noble
          tag_suffix: tomcat9-jdk11
          java_major: 11
          java_kind: jdk
          variant: tomcat
          max_size_bytes: 700000000
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Build local smoke-test image
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        pull: true
        tags: local/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
    - name: Test Java and OpenTelemetry Agent runtime
      run: >-
        ./open-telemetry/agent/test-java-image.sh
        local/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
        ${{ env.OTEL_VERSION }}
        ${{ matrix.java_major }}
        ${{ matrix.java_kind }}
        ${{ matrix.variant }}
        ${{ matrix.max_size_bytes }}
    - name: Build multi-architecture candidate
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
        pull: true
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: open-telemetry/agent/Dockerfile.jdk11
          java_base_tag: 11.0.32_9-jdk-alpine
          tag_suffix: jdk11
          platforms: linux/amd64
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17
          java_base_tag: 17.0.20_8-jdk-noble
          tag_suffix: jdk17
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17-alpine
          java_base_tag: 17.0.20_8-jdk-alpine
          tag_suffix: jdk17-alpine
          platforms: linux/amd64
        - dockerfile: open-telemetry/agent/Dockerfile.jdk17-ffmpeg
          java_base_tag: 17.0.20_8-jdk-noble
          tag_suffix: jdk17-ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.12_8-jdk-noble
          tag_suffix: jdk21
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.12_8-jdk-alpine
          tag_suffix: jdk21-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.12_8-jdk-noble
          tag_suffix: jdk21-ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21
          java_base_tag: 21.0.12_8-jre-noble
          tag_suffix: jre21
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-alpine
          java_base_tag: 21.0.12_8-jre-alpine
          tag_suffix: jre21-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk21-ffmpeg
          java_base_tag: 21.0.12_8-jre-noble
          tag_suffix: jre21-ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25
          java_base_tag: 25.0.4_7-jdk-noble
          tag_suffix: jdk25
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-alpine
          java_base_tag: 25.0.4_7-jdk-alpine
          tag_suffix: jdk25-alpine
        - dockerfile: open-telemetry/agent/Dockerfile.jdk25-ffmpeg
          java_base_tag: 25.0.4_7-jdk-noble
          tag_suffix: jdk25-ffmpeg
        - dockerfile: open-telemetry/agent/Dockerfile.tomcat10.jdk17
          java_base_tag: 10.1.59-jdk17-temurin-noble
          tag_suffix: tomcat10-jdk17
        - dockerfile: open-telemetry/agent/Dockerfile.tomcat9.jdk11
          java_base_tag: 9.0.121-jdk11-temurin-noble
          tag_suffix: tomcat9-jdk11
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and publish OpenTelemetry v2 image after verification
      uses: docker/build-push-action@v7
      with:
        context: open-telemetry/agent
        file: ${{ matrix.dockerfile }}
        platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
        pull: true
        push: true
        tags: |
          ghcr.io/keecon/open-telemetry:${{ env.OTEL_VERSION }}-${{ matrix.tag_suffix }}
          ghcr.io/keecon/open-telemetry:2-${{ matrix.tag_suffix }}
        build-args: |
          JAVA_BASE_TAG=${{ matrix.java_base_tag }}
          OTEL_VERSION=${{ env.OTEL_VERSION }}
          OTEL_SHA256=${{ env.OTEL_SHA256 }}
